name: Blocker
description: Record a condition that prevents a mission from reaching its acceptance criteria.
title: "Blocker: "
labels: ["type: blocker", "owner: captain"]
body:
  - type: markdown
    attributes:
      value: |
        A blocker is an observed constraint, not a standing instruction or authorization. Use private-safe references only.
  - type: input
    id: mission-reference
    attributes:
      label: Related mission
      description: Link the mission issue or provide its mission ID.
      placeholder: "#123 or career-2026-09-12-exampleco"
    validations:
      required: true
  - type: dropdown
    id: blocker-kind
    attributes:
      label: Blocker type
      options:
        - Missing user input
        - Missing authorization
        - Unavailable capability or access
        - Failed dependency
        - Uncertain external state
        - Evidence gap
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed condition and evidence
      description: State what was observed, when, and the private-safe evidence reference.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and safe independent work
      description: Explain which acceptance criterion is blocked and what can still proceed without expanding scope.
    validations:
      required: true
  - type: textarea
    id: resolution
    attributes:
      label: Resolution needed
      description: State the smallest user decision, access change, or evidence needed to unblock.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include secrets, credentials, personal documents, or full communication content.
          required: true
